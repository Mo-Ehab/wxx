[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Wxx"
version = "1.0.0"
description = "Machine learning framework using Webgpu"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mo", email = "mo7medehab.16@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=2.5.0",
    "wgpu>=0.32.0",
]


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/wxx/shaders"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.setuptools]
package-dir = {"" = "src"}

packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
"wxx.shaders" = ["**/*.wgsl"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]